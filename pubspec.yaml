name: triptab
description: "Real-time shared trip expense ledger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.0
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  supabase_flutter: ^2.3.0
  uuid: ^4.0.0
  google_fonts: ^6.1.0
  go_router: ^13.0.0
  intl: ^0.19.0
  flutter_local_notifications: ^22.0.1
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  share_plus: ^13.2.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.15.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
